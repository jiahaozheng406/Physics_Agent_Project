<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2c43" />
  <title>Physics Agent 离线提示</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7fafc;
      --panel: rgba(255, 255, 255, 0.94);
      --text: #18243a;
      --soft: #5f6d84;
      --accent: #45668a;
      --accent-2: #82cbc1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
      font-family: "Plus Jakarta Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(720px 360px at -8% -10%, rgba(108, 143, 245, 0.12), transparent 60%),
        radial-gradient(640px 320px at 108% 110%, rgba(130, 203, 193, 0.18), transparent 58%),
        linear-gradient(150deg, #fbf8f3, #eff4f8 54%, var(--bg) 100%);
    }

    .panel {
      width: min(420px, 100%);
      border-radius: 28px;
      padding: 28px 24px;
      background: var(--panel);
      border: 1px solid rgba(22, 35, 61, 0.08);
      box-shadow: 0 24px 60px rgba(34, 55, 90, 0.12);
      backdrop-filter: blur(10px);
    }

    .badge {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(130, 203, 193, 0.24), rgba(108, 143, 245, 0.24));
      color: var(--accent);
      font-size: 26px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      line-height: 1.7;
      color: var(--soft);
    }

    .actions {
      margin-top: 22px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button,
    a {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    button {
      background: linear-gradient(135deg, var(--accent), #5d7cf6);
      color: white;
    }

    a {
      background: rgba(22, 35, 61, 0.06);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="badge">⌁</div>
    <h1>当前网络不可用</h1>
    <p>Physics Agent 的界面已经准备好，但对话、文档检索与实验目录同步仍然需要网络连接。请恢复网络后重试。</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">重新连接</button>
      <a href="/">返回首页</a>
    </div>
  </div>
</body>
</html>
